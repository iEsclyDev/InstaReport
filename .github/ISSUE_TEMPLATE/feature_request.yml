name: ✨ Feature Request
description: Propose a new feature or improvement for InstaReport
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe your idea clearly.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of InstaReport does this concern?
      options:
        - Desktop App
        - Telegram Bot
        - Reporting Engine
        - Account Management
        - Licensing
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you envision the feature working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or alternatives you've considered.

  - type: textarea
    id: platform
    attributes:
      label: Platform priority
      description: Which platform(s) should this support first?
      placeholder: "e.g. Windows, Telegram Bot"
