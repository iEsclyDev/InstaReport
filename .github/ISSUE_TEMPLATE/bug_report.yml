name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in InstaReport
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did you experience the issue on?
      options:
        - Windows 10
        - Windows 11
        - Ubuntu
        - Kali Linux
        - Debian
        - Android (Termux)
        - Telegram Bot
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of InstaReport are you using?
      placeholder: "e.g. 8.7.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any error messages, logs or screenshots if available.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us (proxies, accounts, network, etc.).
